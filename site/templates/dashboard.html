<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Dashboard</title>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="/static/js/dashboard.js" defer></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            padding: 30px;
        }
        h1 {
            margin-bottom: 20px;
        }
        .cards {
            display: flex;
            gap: 20px;
            margin-bottom: 40px;
        }
        .card {
            background: white;
            padding: 20px;
            border-radius: 8px;
            width: 200px;
            box-shadow: 0 2px 6px rgba(0,0,0,.1);
        }
        canvas {
            background: white;
            padding: 20px;
            border-radius: 8px;
        }
    </style>
</head>
<body>

<h1>📊 Dashboard</h1>

<div class="cards">
    <div class="card">Total: <strong id="total">0</strong></div>
    <div class="card">Novo: <strong id="novo">0</strong></div>
    <div class="card">Contato: <strong id="contato">0</strong></div>
    <div class="card">Fechado: <strong id="fechado">0</strong></div>
</div>

<canvas id="grafico" width="400" height="200"></canvas>

</body>
</html>
