<!DOCTYPE html>
<html>
<head>
    <title>Login</title>
    <style>
        body {
            background: #f4f6f8;
            font-family: Arial;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        form {
            background: white;
            padding: 30px;
            border-radius: 8px;
            width: 300px;
        }
        input, button {
            width: 100%;
            padding: 10px;
            margin-top: 10px;
        }
    </style>
</head>
<body>

<form method="post">
    <h2>Login</h2>
    <input name="email" placeholder="Email" required>
    <input name="senha" type="password" placeholder="Senha" required>
    <button>Entrar</button>
</form>

</body>
</html>
